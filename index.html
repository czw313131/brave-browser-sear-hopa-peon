<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Search Tab</title>
  <link rel="icon" href="lion (1).webp">

  <style>
    :root {
      --color-bg-box: #414559;
      --color-bg-card: rgba(65, 69, 89, 0.67);
      --color-accent: #f2d5cf;
      --color-text: #c6d0f5;
      --radius-main: 16px;
      --radius-mobile: 12px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: url("2026_06_19_0lw_Kleki (1).webp") center / cover no-repeat;
      overflow: hidden;
    }

    /* 停用選取與拖拽 */
    .unselectable {
      -webkit-user-drag: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .foreground {
      position: absolute;
      left: 50%;
      top: 33.33%;
      transform: translate(-50%, -50%);
      width: 15%;
      height: auto;
    }

    .search-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 50px;
      display: flex;
      align-items: center;
      background-color: var(--color-bg-box);
      border: 2px solid var(--color-accent);
      border-radius: var(--radius-main);
      overflow: hidden;
    }

    .search-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      margin: 0 14px;
      flex-shrink: 0;
    }

    .divider {
      width: 2px;
      height: 28px;
      background-color: var(--color-accent);
      flex-shrink: 0;
    }

    .input-box {
      flex: 1;
      height: 100%;
      padding: 0 14px;
      background: transparent;
      color: var(--color-text);
      border: none;
      outline: none;
      font-size: 16px;
    }

    .input-box::placeholder {
      color: var(--color-text);
      opacity: 0.7;
    }

    .weather-card {
      position: absolute;
      left: 50%;
      top: calc(75% - 82.5px);
      transform: translateX(-50%);
      width: 500px;
      height: 190px;
      background-color: var(--color-bg-card);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 2px solid var(--color-accent);
      border-radius: var(--radius-main);
      color: var(--color-text);
      overflow: hidden;
    }

    .weather-location {
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 17px;
      line-height: 20px;
      color: var(--color-text);
    }

    .weather-data {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      width: 82%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .weather-item {
      width: 42%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .weather-icon {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .weather-value {
      font-size: 16px;
      line-height: 22px;
      color: var(--color-text);
      white-space: nowrap;
    }

    .compass, .pressure-icon {
      position: relative;
      width: 64px;
      height: 64px;
      border: 2px solid var(--color-accent);
      border-radius: 50%;
    }

    .compass span {
      position: absolute;
      font-size: 10px;
      font-weight: 500;
      color: var(--color-accent);
    }

    .compass-n { top: 3px; left: 50%; transform: translateX(-50%); }
    .compass-e { right: 4px; top: 50%; transform: translateY(-50%); }
    .compass-s { bottom: 3px; left: 50%; transform: translateX(-50%); }
    .compass-w { left: 4px; top: 50%; transform: translateY(-50%); }

    .compass-pointer, .pressure-pointer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg);
      background-color: var(--color-accent);
      border-radius: 2px;
    }

    .compass-pointer {
      height: 23px;
    }

    .compass-pointer::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 8px solid var(--color-accent);
    }

    .compass-center, .pressure-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      background-color: var(--color-accent);
      border-radius: 50%;
    }

    .pressure-icon::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 30px;
      border-top: 2px solid var(--color-accent);
      border-radius: 50%;
    }

    .pressure-pointer {
      height: 20px;
    }

    .pressure-pointer::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 7px solid var(--color-accent);
    }

    /* 行動裝置響應式調整 */
    @media (max-width: 768px) {
      body {
        overflow: auto;
        background-position: center top;
        -webkit-overflow-scrolling: touch;
      }

      .foreground {
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: 42%;
        max-width: 220px;
        height: auto;
      }

      .search-box {
        left: 50%;
        top: 52%;
        transform: translate(-50%, -50%);
        width: calc(100% - 32px);
        max-width: 540px;
        height: 56px;
        border-radius: var(--radius-mobile);
        padding-right: 12px;
      }

      .search-icon {
        width: 24px;
        height: 24px;
        margin-left: 12px;
        margin-right: 8px;
      }

      .divider {
        height: 22px;
        margin-right: 8px;
      }

      .input-box {
        padding: 0 10px;
      }

      .input-box::placeholder {
        opacity: 0.85;
      }

      img {
        -webkit-tap-highlight-color: transparent;
      }

      .weather-card {
        width: calc(100% - 32px);
        max-width: 540px;
        height: 180px;
        top: calc(76% - 76px);
        border-radius: var(--radius-mobile);
      }

      .weather-location {
        top: 12px;
        left: 16px;
      }

      .weather-data {
        width: 90%;
        top: 55%;
      }

      .weather-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 7px;
      }

      .compass, .pressure-icon {
        width: 58px;
        height: 58px;
      }

      .weather-value {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <img class="foreground unselectable" src="brave_color_darkbackground.webp" alt="Logo">

  <div class="search-box">
    <img class="search-icon unselectable" src="startpage-logomark.webp" alt="Search Icon">
    <div class="divider"></div>
    <input type="text" class="input-box" placeholder="Search Startpage" id="search" autofocus autocomplete="off">
  </div>

  <div class="weather-card unselectable">
    <div class="weather-location" id="weather-location">Loading…</div>

    <div class="weather-data">
      <div class="weather-item">
        <div class="weather-icon">
          <div class="compass">
            <span class="compass-n">N</span>
            <span class="compass-e">E</span>
            <span class="compass-s">S</span>
            <span class="compass-w">W</span>
            <div class="compass-pointer" id="compass-pointer"></div>
            <div class="compass-center"></div>
          </div>
        </div>
        <div class="weather-value" id="wind-value">Loading…</div>
      </div>

      <div class="weather-item">
        <div class="weather-icon">
          <div class="pressure-icon">
            <div class="pressure-pointer" id="pressure-pointer"></div>
            <div class="pressure-center"></div>
          </div>
        </div>
        <div class="weather-value" id="pressure-value">Loading…</div>
      </div>
    </div>
  </div>

  <script>
    const DIRECTIONS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];

    // 快取 DOM 元素
    const els = {
      search: document.getElementById("search"),
      location: document.getElementById("weather-location"),
      wind: document.getElementById("wind-value"),
      compassPointer: document.getElementById("compass-pointer"),
      pressure: document.getElementById("pressure-value"),
      pressurePointer: document.getElementById("pressure-pointer")
    };

    // 禁用圖片右鍵選單 (替代內聯事件)
    document.querySelectorAll("img").forEach(img => {
      img.addEventListener("contextmenu", e => e.preventDefault());
    });

    // 搜尋功能處理
    els.search.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const query = els.search.value.trim();
        if (query) {
          const url = new URL("https://www.startpage.com/do/search");
          url.searchParams.set("q", query);
          url.searchParams.set("segment", "startpage.brave");
          window.location.href = url.toString();
        }
      }
    });

    // 取得天氣資料
    async function fetchWeather() {
      try {
        const res = await fetch("weather.json");
        if (!res.ok) throw new Error("無法取得 weather.json");
        
        const data = await res.json();

        els.location.textContent = data.location;

        const windDir = Number(data.wind_direction_10m);
        const dirIndex = Math.round(windDir / 22.5) % 16;
        els.wind.textContent = `${windDir}° · ${DIRECTIONS[dirIndex]}`;
        els.compassPointer.style.transform = `translate(-50%, -100%) rotate(${windDir}deg)`;

        const pressure = Number(data.surface_pressure);
        const pressureAngle = -90 + ((pressure - 950) / 100) * 180;
        els.pressurePointer.style.transform = `translate(-50%, -100%) rotate(${pressureAngle}deg)`;
        els.pressure.textContent = `${pressure.toFixed(1)} hPa`;
      } catch (err) {
        console.error(err);
        els.location.textContent = "Failed to load weather data";
        els.wind.textContent = "—";
        els.pressure.textContent = "—";
      }
    }

    fetchWeather();
  </script>

</body>
</html>
