<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>背景圖片</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background-image: url("https://files.catbox.moe/ov1pn3.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      overflow: hidden;
    }

    /* 第二張圖片 */
    .foreground {
      position: absolute;
      left: 50%;
      top: 33.33%;
      transform: translate(-50%, -50%);

      width: 15%;
      height: auto;
    }

    /* 搜尋框 */
    .search-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: 500px;
      height: 50px;

      display: flex;
      align-items: center;

      background-color: #51576d;
      border: 2px solid #a6d189;
      border-radius: 16px;

      box-sizing: border-box;
      overflow: hidden;
    }

    /* 左側圖片 */
    .search-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;

      margin-left: 14px;
      margin-right: 14px;
      flex-shrink: 0;
    }

    /* 豎線 */
    .divider {
      width: 2px;
      height: 28px;
      background-color: #a6d189;
      flex-shrink: 0;
    }

    /* 輸入文字 */
    .input-box {
      flex: 1;
      height: 100%;

      padding: 0 14px;

      background: transparent;
      color: #c6d0f5;

      border: none;
      outline: none;

      font-size: 16px;
      box-sizing: border-box;
    }

    .input-box::placeholder {
      color: #c6d0f5;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <img
    class="foreground"
    src="https://files.catbox.moe/e0on4s.webp"
    alt=""
  >

  <div class="search-box">
    <img
      class="search-icon"
      src="https://files.catbox.moe/1gujs1.png"
      alt=""
    >

    <div class="divider"></div>

    <input
      type="text"
      class="input-box"
      placeholder="輸入文字..."
      id="search"
      autofocus
    >
  </div>

  <script>
    const searchBox = document.getElementById("search");

    searchBox.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        const query = searchBox.value.trim();

        if (query !== "") {
          const url =
            "https://www.startpage.com/do/search?q=" +
            encodeURIComponent(query) +
            "&segment=startpage.brave";

          window.location.href = url;
        }
      }
    });
  </script>

</body>
</html>
