<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Search Tab</title>
  <link rel="icon" href="lion (1).webp">

  <style>
    :root {
      --color-bg-card: rgba(65, 69, 89, 0.67);
      --color-box: #414559;
      --color-accent: #f2d5cf;
      --color-text: #c6d0f5;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: url("2026_06_19_0lw_Kleki (1).webp") center / cover no-repeat;
      overflow: hidden;
    }

    .no-select {
      -webkit-user-drag: none;
      user-select: none;
    }

    /* Logo - 位置保持不變 */
    .foreground {
      position: absolute;
      left: 50%;
      top: 33.33%;
      transform: translate(-50%, -50%);
      width: 15%;
      height: auto;
    }

    /* 搜尋框 - 位置保持不變 (高度 50px，底部在 50% + 25px) */
    .search-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 50px;
      display: flex;
      align-items: center;
      background-color: var(--color-box);
      border: 2px solid var(--color-accent);
      border-radius: 16px;
      overflow: hidden;
    }

    .search-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      margin: 0 14px;
      flex-shrink: 0;
    }

    .divider {
      width: 2px;
      height: 28px;
      background-color: var(--color-accent);
      flex-shrink: 0;
    }

    .input-box {
      flex: 1;
      height: 100%;
      padding: 0 14px;
      background: transparent;
      color: var(--color-text);
      border: none;
      outline: none;
      font-size: 16px;
    }

    .input-box::placeholder {
      color: var(--color-text);
      opacity: 0.7;
    }

    /* 捷徑區塊 - 位於搜尋框與天氣卡片之間 */
    .shortcuts-container {
      position: absolute;
      left: 50%;
      top: calc(50% + 49px);
      transform: translateX(-50%);
      width: 500px;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .shortcut-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--color-text);
      transition: transform 0.2s ease;
    }

    .shortcut-item:hover {
      transform: translateY(-3px);
    }

    .shortcut-icon-wrapper {
      width: 60px;
      height: 60px;
      background-color: var(--color-bg-card);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 2px solid var(--color-accent);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .shortcut-icon-wrapper img {
      width: 36px;
      height: 36px;
      object-fit: contain;
    }

    .shortcut-label {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
    }

    /* 天氣卡片 - 位置順延下移 */
    .weather-card {
      position: absolute;
      left: 50%;
      top: calc(50% + 161px);
      transform: translateX(-50%);
      width: 500px;
      height: 190px;
      background-color: var(--color-bg-card);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 2px solid var(--color-accent);
      border-radius: 16px;
      color: var(--color-text);
      overflow: hidden;
    }

    .weather-location {
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 17px;
      line-height: 20px;
      color: var(--color-text);
    }

    .weather-data {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      width: 82%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .weather-item {
      width: 42%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .weather-icon {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .weather-value {
      font-size: 16px;
      line-height: 22px;
      color: var(--color-text);
      white-space: nowrap;
    }

    .compass, .pressure-icon {
      position: relative;
      width: 64px;
      height: 64px;
      border: 2px solid var(--color-accent);
      border-radius: 50%;
    }

    .compass span {
      position: absolute;
      font-size: 10px;
      font-weight: 500;
      color: var(--color-accent);
    }

    .compass-n { top: 3px; left: 50%; transform: translateX(-50%); }
    .compass-e { right: 4px; top: 50%; transform: translateY(-50%); }
    .compass-s { bottom: 3px; left: 50%; transform: translateX(-50%); }
    .compass-w { left: 4px; top: 50%; transform: translateY(-50%); }

    .compass-pointer, .pressure-pointer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg);
      background-color: var(--color-accent);
      border-radius: 2px;
    }

    .compass-pointer {
      height: 23px;
    }

    .compass-pointer::before {
      content: "";
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 8px solid var(--color-accent);
    }

    .compass-center, .pressure-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      background-color: var(--color-accent);
      border-radius: 50%;
    }

    .pressure-icon::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 30px;
      border-top: 2px solid var(--color-accent);
      border-radius: 50%;
    }

    .pressure-pointer {
      height: 20px;
    }

    .pressure-pointer::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 7px solid var(--color-accent);
    }

    /* 手機版響應式樣式 */
    @media (max-width: 768px) {
      body {
        overflow: auto;
        background-position: center top;
        -webkit-overflow-scrolling: touch;
      }

      .foreground {
        top: 12% !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        width: 42% !important;
        max-width: 220px;
        height: auto !important;
      }

      .search-box {
        position: absolute !important;
        left: 50% !important;
        top: 45% !important;
        transform: translate(-50%, -50%) !important;
        width: calc(100% - 32px) !important;
        max-width: 540px !important;
        height: 56px !important;
        border-radius: 12px !important;
        padding-right: 12px;
      }

      .search-icon {
        width: 24px !important;
        height: 24px !important;
        margin-left: 12px !important;
        margin-right: 8px !important;
      }

      .divider {
        width: 2px !important;
        height: 22px !important;
        margin-right: 8px;
      }

      .input-box {
        font-size: 16px !important;
        padding: 0 10px !important;
        height: 100% !important;
      }

      .input-box::placeholder {
        font-size: 16px;
        opacity: 0.85;
      }

      img[oncontextmenu] {
        -webkit-user-drag: none;
        user-select: none;
        -webkit-tap-highlight-color: rgba(0,0,0,0);
      }

      .shortcuts-container {
        width: calc(100% - 32px);
        max-width: 540px;
        top: calc(45% + 48px);
      }

      .shortcut-icon-wrapper {
        width: 52px;
        height: 52px;
        border-radius: 12px;
      }

      .shortcut-icon-wrapper img {
        width: 30px;
        height: 30px;
      }

      .weather-card {
        width: calc(100% - 32px);
        max-width: 540px;
        height: 180px;
        top: calc(45% + 154px);
        border-radius: 12px;
      }

      .weather-location {
        top: 12px;
        left: 16px;
        font-size: 17px;
      }

      .weather-data {
        width: 90%;
        top: 55%;
      }

      .weather-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 7px;
      }

      .compass, .pressure-icon {
        width: 58px;
        height: 58px;
      }

      .weather-value {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <img class="foreground no-select" src="brave_color_darkbackground.webp" alt="" oncontextmenu="return false;">

  <div class="search-box">
    <img class="search-icon no-select" src="startpage-logomark.webp" alt="" oncontextmenu="return false;">
    <div class="divider"></div>
    <input type="text" class="input-box" placeholder="Search Startpage" id="search" autofocus>
  </div>

  <!-- 寫死的 5 個捷徑 -->
  <div class="shortcuts-container no-select">
    <a href="https://www.youtube.com" class="shortcut-item">
      <div class="shortcut-icon-wrapper">
        <img src="YT.webp" alt="YT" oncontextmenu="return false;">
      </div>
      <span class="shortcut-label">YT</span>
    </a>

    <a href="https://www.instagram.com" class="shortcut-item">
      <div class="shortcut-icon-wrapper">
        <img src="IG.webp" alt="IG" oncontextmenu="return false;">
      </div>
      <span class="shortcut-label">IG</span>
    </a>

    <a href="https://www.threads.com" class="shortcut-item">
      <div class="shortcut-icon-wrapper">
        <img src="THREADS.webp" alt="脆" oncontextmenu="return false;">
      </div>
      <span class="shortcut-label">脆</span>
    </a>

    <a href="https://x.com/home" class="shortcut-item">
      <div class="shortcut-icon-wrapper">
        <img src="X.webp" alt="X" oncontextmenu="return false;">
      </div>
      <span class="shortcut-label">X</span>
    </a>

    <a href="https://discord.com/channels/@me" class="shortcut-item">
      <div class="shortcut-icon-wrapper">
        <img src="DC.webp" alt="DC" oncontextmenu="return false;">
      </div>
      <span class="shortcut-label">DC</span>
    </a>
  </div>

  <div class="weather-card no-select">
    <div class="weather-location" id="weather-location">Loading…</div>

    <div class="weather-data">
      <div class="weather-item">
        <div class="weather-icon">
          <div class="compass">
            <span class="compass-n">N</span>
            <span class="compass-e">E</span>
            <span class="compass-s">S</span>
            <span class="compass-w">W</span>
            <div class="compass-pointer" id="compass-pointer"></div>
            <div class="compass-center"></div>
          </div>
        </div>
        <div class="weather-value" id="wind-value">Loading…</div>
      </div>

      <div class="weather-item">
        <div class="weather-icon">
          <div class="pressure-icon">
            <div class="pressure-pointer"></div>
            <div class="pressure-center"></div>
          </div>
        </div>
        <div class="weather-value" id="pressure-value">Loading…</div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const searchBox = $("search");
    const DIRECTIONS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];

    searchBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const query = searchBox.value.trim();
        if (query) {
          window.location.href = `https://www.startpage.com/do/search?q=${encodeURIComponent(query)}&segment=startpage.brave`;
        }
      }
    });

    (async () => {
      const locationEl = $("weather-location");
      const windEl = $("wind-value");
      const pressureEl = $("pressure-value");
      const compassPtr = $("compass-pointer");
      const pressurePtr = document.querySelector(".pressure-pointer");

      try {
        const res = await fetch("weather.json");
        if (!res.ok) throw new Error();
        const data = await res.json();

        locationEl.textContent = data.location;

        const windDir = Number(data.wind_direction_10m);
        const dirIndex = Math.round(windDir / 22.5) % 16;
        windEl.textContent = `${windDir}° · ${DIRECTIONS[dirIndex]}`;
        compassPtr.style.transform = `translate(-50%, -100%) rotate(${windDir}deg)`;

        const pressure = Number(data.surface_pressure);
        const pressureAngle = -90 + ((pressure - 950) / 100) * 180;
        pressurePtr.style.transform = `translate(-50%, -100%) rotate(${pressureAngle}deg)`;
        pressureEl.textContent = `${pressure.toFixed(1)} hPa`;
      } catch (err) {
        console.error(err);
        locationEl.textContent = "Failed to load weather data";
        windEl.textContent = "—";
        pressureEl.textContent = "—";
      }
    })();
  </script>

</body>
</html>
