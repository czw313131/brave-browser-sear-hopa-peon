<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新搜尋分頁</title>
  <link rel="icon" href="lion.webp">

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background-image: url("2026_06_19_0lw_Kleki (1).webp");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      overflow: hidden;
    }

    /* 第二張圖片 */
    .foreground {
      position: absolute;
      left: 50%;
      top: 33.33%;
      transform: translate(-50%, -50%);

      width: 15%;
      height: auto;
    }

    /* 搜尋框 */
    .search-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: 500px;
      height: 50px;

      display: flex;
      align-items: center;

      background-color: #414559;
      border: 2px solid #a6d189;
      border-radius: 16px;

      box-sizing: border-box;
      overflow: hidden;
    }

    /* 左側圖片 */
    .search-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;

      margin-left: 14px;
      margin-right: 14px;
      flex-shrink: 0;
    }

    /* 豎線 */
    .divider {
      width: 2px;
      height: 28px;
      background-color: #a6d189;
      flex-shrink: 0;
    }

    /* 輸入文字 */
    .input-box {
      flex: 1;
      height: 100%;

      padding: 0 14px;

      background: transparent;
      color: #c6d0f5;

      border: none;
      outline: none;

      font-size: 16px;
      box-sizing: border-box;
    }

    .input-box::placeholder {
      color: #c6d0f5;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
  /* 讓背景在手機上可捲動並略微置頂 */
  body {
    overflow: auto;
    background-position: center top;
    -webkit-overflow-scrolling: touch;
  }

  /* 前景圖：置於上方、較大但有最大寬度 */
  .foreground {
    top: 12% !important;
    left: 50% !important;
    transform: translateX(-50%) !important; /* 不再垂直置中 */
    width: 42% !important;
    max-width: 220px;
    height: auto !important;
  }

  /* 搜尋框：寬度使用 viewport，置中並略往下 */
  .search-box {
    position: absolute !important;
    left: 50% !important;
    top: 52% !important;
    transform: translate(-50%, -50%) !important;
    width: calc(100% - 32px) !important; /* 留邊距 */
    max-width: 540px !important;
    height: 56px !important;
    border-radius: 12px !important;
    padding-right: 12px;
    box-sizing: border-box;
  }

  /* logo 圖示縮小、減少間距 */
  .search-icon {
    width: 24px !important;
    height: 24px !important;
    margin-left: 12px !important;
    margin-right: 8px !important;
  }

  /* 分隔線高度微調 */
  .divider {
    width: 2px !important;
    height: 22px !important;
    margin-right: 8px;
  }

  /* 輸入框：增加左右內距，字體大小與行高更適合觸控 */
  .input-box {
    font-size: 16px !important;
    padding: 0 10px !important;
    height: 100% !important;
  }

  .input-box::placeholder {
    font-size: 16px;
    opacity: 0.85;
  }

  /* 防止圖片在觸控上被選取或產生高亮 */
  img[oncontextmenu] {
    -webkit-user-drag: none;
    user-select: none;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
  }
}
  </style>
</head>

<body>

  <img
    class="foreground"
    src="brave_color_darkbackground.webp"
    alt=""
    oncontextmenu="return false;"
  >

  <div class="search-box">
    <img
      class="search-icon"
      src="startpage-logomark.webp"
      alt=""
      oncontextmenu="return false;"
    >

    <div class="divider"></div>

    <input
      type="text"
      class="input-box"
      placeholder="搜尋Startpage"
      id="search"
      autofocus
    >
  </div>

  <script>
    const searchBox = document.getElementById("search");

    searchBox.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        const query = searchBox.value.trim();

        if (query !== "") {
          const url =
            "https://www.startpage.com/do/search?q=" +
            encodeURIComponent(query) +
            "&segment=startpage.brave";

          window.location.href = url;
        }
      }
    });
  </script>

</body>
</html>
