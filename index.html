<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Search Tab</title>
  <link rel="icon" href="lion (1).webp">

  <style>
    :root {
      --clr-border: #f2d5cf;
      --clr-text: #c6d0f5;
      --clr-bg: #414559;
      --clr-bg-rgb: 65, 69, 89;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: url("2026_06_19_0lw_Kleki (1).webp") center / cover no-repeat;
      overflow: hidden;
    }

    .foreground {
      position: absolute;
      left: 50%;
      top: 33.33%;
      transform: translate(-50%, -50%);
      -webkit-user-drag: none;
      user-select: none;
      width: 15%;
      height: auto;
    }

    .search-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 500px;
      height: 50px;
      display: flex;
      align-items: center;
      background-color: var(--clr-bg);
      border: 2px solid var(--clr-border);
      border-radius: 16px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .search-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      -webkit-user-drag: none;
      user-select: none;
      margin: 0 14px;
      flex-shrink: 0;
    }

    .divider {
      width: 2px;
      height: 28px;
      background-color: var(--clr-border);
      flex-shrink: 0;
    }

    .input-box {
      flex: 1;
      height: 100%;
      padding: 0 14px;
      background: transparent;
      color: var(--clr-text);
      border: none;
      outline: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    .input-box::placeholder {
      color: var(--clr-text);
      opacity: 0.7;
    }

    .weather-card {
      position: absolute;
      left: 50%;
      top: calc(75% - 82.5px);
      transform: translateX(-50%);
      width: 500px;
      height: 190px;
      box-sizing: border-box;
      background-color: rgba(var(--clr-bg-rgb), 0.67);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 2px solid var(--clr-border);
      border-radius: 16px;
      color: var(--clr-text);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .weather-location {
      position: absolute;
      top: 14px;
      left: 18px;
      font-size: 17px;
      line-height: 20px;
      color: var(--clr-text);
    }

    .weather-data {
      position: absolute;
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      width: 82%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .weather-item {
      width: 42%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .weather-icon {
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .weather-value {
      font-size: 16px;
      line-height: 22px;
      color: var(--clr-text);
      white-space: nowrap;
    }

    .compass, .pressure-icon {
      position: relative;
      width: 64px;
      height: 64px;
      border: 2px solid var(--clr-border);
      border-radius: 50%;
      box-sizing: border-box;
    }

    .compass span {
      position: absolute;
      font-size: 10px;
      font-weight: 500;
      color: var(--clr-border);
    }

    .compass-n { top: 3px; left: 50%; transform: translateX(-50%); }
    .compass-e { right: 4px; top: 50%; transform: translateY(-50%); }
    .compass-s { bottom: 3px; left: 50%; transform: translateX(-50%); }
    .compass-w { left: 4px; top: 50%; transform: translateY(-50%); }

    .compass-pointer, .pressure-pointer {
      position: absolute;
      left: 50%;
      top: 50%;
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg);
      background-color: var(--clr-border);
      border-radius: 2px;
    }

    .compass-pointer { height: 23px; }
    .pressure-pointer { height: 20px; }

    .compass-pointer::before, .pressure-pointer::before {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
    }

    .compass-pointer::before {
      top: -6px;
      border-left: 5px solid transparent;
      border-right: 5px solid transparent;
      border-bottom: 8px solid var(--clr-border);
    }

    .pressure-pointer::before {
      top: -5px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 7px solid var(--clr-border);
    }

    .compass-center, .pressure-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      transform: translate(-50%, -50%);
      background-color: var(--clr-border);
      border-radius: 50%;
    }

    .pressure-icon::before {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      height: 30px;
      border-top: 2px solid var(--clr-border);
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      body {
        overflow: auto;
        background-position: center top;
        -webkit-overflow-scrolling: touch;
      }

      .foreground {
        top: 12%;
        transform: translateX(-50%);
        width: 42%;
        max-width: 220px;
      }

      .search-box {
        top: 52%;
        width: calc(100% - 32px);
        max-width: 540px;
        height: 56px;
        border-radius: 12px;
        padding-right: 12px;
      }

      .search-icon {
        width: 24px;
        height: 24px;
        margin-left: 12px;
        margin-right: 8px;
      }

      .divider {
        height: 22px;
        margin-right: 8px;
      }

      .input-box {
        padding: 0 10px;
      }

      .input-box::placeholder {
        opacity: 0.85;
      }

      img[oncontextmenu] {
        -webkit-user-drag: none;
        user-select: none;
        -webkit-tap-highlight-color: rgba(0,0,0,0);
      }

      .weather-card {
        width: calc(100% - 32px);
        max-width: 540px;
        height: 180px;
        top: calc(76% - 76px);
        border-radius: 12px;
      }

      .weather-location {
        top: 12px;
        left: 16px;
      }

      .weather-data {
        width: 90%;
        top: 55%;
      }

      .weather-icon {
        width: 64px;
        height: 64px;
        margin-bottom: 7px;
      }

      .compass, .pressure-icon {
        width: 58px;
        height: 58px;
      }

      .weather-value {
        font-size: 15px;
      }
    }
  </style>
</head>
<body>

  <img class="foreground" src="brave_color_darkbackground.webp" alt="" oncontextmenu="return false;">

  <div class="search-box">
    <img class="search-icon" src="startpage-logomark.webp" alt="" oncontextmenu="return false;">
    <div class="divider"></div>
    <input type="text" class="input-box" placeholder="Search Startpage" id="search" autofocus>
  </div>

  <div class="weather-card">
    <div class="weather-location" id="weather-location">Loading…</div>

    <div class="weather-data">
      <div class="weather-item">
        <div class="weather-icon">
          <div class="compass">
            <span class="compass-n">N</span>
            <span class="compass-e">E</span>
            <span class="compass-s">S</span>
            <span class="compass-w">W</span>
            <div class="compass-pointer" id="compass-pointer"></div>
            <div class="compass-center"></div>
          </div>
        </div>
        <div class="weather-value" id="wind-value">Loading…</div>
      </div>

      <div class="weather-item">
        <div class="weather-icon">
          <div class="pressure-icon">
            <div class="pressure-pointer"></div>
            <div class="pressure-center"></div>
          </div>
        </div>
        <div class="weather-value" id="pressure-value">Loading…</div>
      </div>
    </div>
  </div>

  <script>
    const searchBox = document.getElementById("search");

    searchBox.addEventListener("keydown", e => {
      if (e.key !== "Enter") return;
      const query = searchBox.value.trim();
      if (query) window.location.href = `https://www.startpage.com/do/search?q=${encodeURIComponent(query)}&segment=startpage.brave`;
    });

    const DIRECTIONS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];

    (async () => {
      const locationEl = document.getElementById("weather-location");
      const windEl = document.getElementById("wind-value");
      const pressureEl = document.getElementById("pressure-value");

      try {
        const res = await fetch("weather.json");
        if (!res.ok) throw new Error("無法取得 weather.json");
        const data = await res.json();

        locationEl.textContent = data.location;

        const windDir = Number(data.wind_direction_10m);
        windEl.textContent = `${windDir}° · ${DIRECTIONS[Math.round(windDir / 22.5) % 16]}`;
        document.getElementById("compass-pointer").style.transform = `translate(-50%, -100%) rotate(${windDir}deg)`;

        const pressure = Number(data.surface_pressure);
        const pressureAngle = -90 + ((pressure - 950) / 100) * 180;
        document.querySelector(".pressure-pointer").style.transform = `translate(-50%, -100%) rotate(${pressureAngle}deg)`;
        pressureEl.textContent = `${pressure.toFixed(1)} hPa`;
      } catch (err) {
        console.error(err);
        locationEl.textContent = "Failed to load weather data";
        windEl.textContent = "—";
        pressureEl.textContent = "—";
      }
    })();
  </script>

</body>
</html>
