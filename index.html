<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新搜尋分頁</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background-image: url("2026_06_19_0lw_Kleki (1).webp");
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      overflow: hidden;
    }

    /* 第二張圖片 */
    .foreground {
      position: absolute;
      left: 50%;
      top: 33.33%;
      transform: translate(-50%, -50%);

      width: 15%;
      height: auto;
    }

    /* 搜尋框 */
    .search-box {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      width: 500px;
      height: 50px;

      display: flex;
      align-items: center;

      background-color: #414559;
      border: 2px solid #a6d189;
      border-radius: 16px;

      box-sizing: border-box;
      overflow: hidden;
    }

    /* 左側圖片 */
    .search-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;

      margin-left: 14px;
      margin-right: 14px;
      flex-shrink: 0;
    }

    /* 豎線 */
    .divider {
      width: 2px;
      height: 28px;
      background-color: #a6d189;
      flex-shrink: 0;
    }

    /* 輸入文字 */
    .input-box {
      flex: 1;
      height: 100%;

      padding: 0 14px;

      background: transparent;
      color: #c6d0f5;

      border: none;
      outline: none;

      font-size: 16px;
      box-sizing: border-box;
    }

    .input-box::placeholder {
      color: #c6d0f5;
      opacity: 0.7;
    }


    /* =========================================
       Liquid Glass 卡片
       ========================================= */

    .liquid-glass {
      position: absolute;
      left: 50%;
      bottom: 6%;
      transform: translateX(-50%);

      width: 520px;
      min-height: 72px;
      padding: 0 30px;

      display: flex;
      align-items: center;
      justify-content: center;

      box-sizing: border-box;

      border-radius: 26px;

      background:
        linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.24) 0%,
          rgba(255, 255, 255, 0.10) 35%,
          rgba(255, 255, 255, 0.06) 100%
        );

      border: 1px solid rgba(255, 255, 255, 0.38);

      backdrop-filter:
        blur(20px)
        saturate(170%)
        brightness(1.08);

      -webkit-backdrop-filter:
        blur(20px)
        saturate(170%)
        brightness(1.08);

      box-shadow:
        0 12px 35px rgba(0, 0, 0, 0.22),
        0 2px 8px rgba(0, 0, 0, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.55),
        inset 0 -1px 2px rgba(255, 255, 255, 0.12);

      overflow: hidden;
      isolation: isolate;
    }

    /* 玻璃折射 */
    .glass-refraction {
      position: absolute;
      inset: -15px;

      background:
        radial-gradient(
          circle at 20% 15%,
          rgba(255, 255, 255, 0.20),
          transparent 35%
        ),
        radial-gradient(
          circle at 80% 85%,
          rgba(255, 255, 255, 0.10),
          transparent 40%
        );

      filter: url("#liquid-refraction");

      opacity: 0.55;

      pointer-events: none;
      z-index: 0;
    }

    /* 玻璃上方高光 */
    .glass-highlight {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 0;

      height: 45%;

      background:
        linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.28),
          rgba(255, 255, 255, 0)
        );

      border-radius: 0 0 50% 50%;

      filter: blur(8px);

      opacity: 0.7;

      pointer-events: none;
      z-index: 1;
    }

    /* 卡片文字 */
    .glass-text {
      position: relative;
      z-index: 2;

      color: #ffffff;

      font-size: 18px;
      font-weight: 500;
      letter-spacing: 1px;
      line-height: 1.5;

      text-align: center;

      text-shadow:
        0 1px 3px rgba(0, 0, 0, 0.35),
        0 0 8px rgba(255, 255, 255, 0.12);
    }

    /* 隱藏 SVG */
    .glass-svg {
      position: absolute;
      width: 0;
      height: 0;
      pointer-events: none;
    }

  </style>
</head>

<body>

  <img
    class="foreground"
    src="brave_color_darkbackground.webp"
    alt=""
    oncontextmenu="return false;"
  >

  <div class="search-box">
    <img
      class="search-icon"
      src="startpage-logomark.webp"
      alt=""
      oncontextmenu="return false;"
    >

    <div class="divider"></div>

    <input
      type="text"
      class="input-box"
      placeholder="搜尋Startpage"
      id="search"
      autofocus
    >
  </div>


  <!-- Liquid Glass 卡片 -->

  <div class="liquid-glass">
    <div class="glass-refraction"></div>
    <div class="glass-highlight"></div>

    <div class="glass-text">
      可名者明名，不可名者不名，業已者業已
    </div>
  </div>


  <!-- Liquid Glass SVG 折射濾鏡 -->

  <svg class="glass-svg" aria-hidden="true">
    <filter id="liquid-refraction">

      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.012 0.025"
        numOctaves="2"
        seed="7"
        result="noise"
      />

      <feDisplacementMap
        in="SourceGraphic"
        in2="noise"
        scale="18"
        xChannelSelector="R"
        yChannelSelector="G"
      />

    </filter>
  </svg>


  <script>
    const searchBox = document.getElementById("search");

    searchBox.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        const query = searchBox.value.trim();

        if (query !== "") {
          const url =
            "https://www.startpage.com/do/search?q=" +
            encodeURIComponent(query) +
            "&segment=startpage.brave";

          window.location.href = url;
        }
      }
    });
  </script>

</body>
</html>
