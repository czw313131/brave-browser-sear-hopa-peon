<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Search Tab</title>
  <link rel="icon" href="lion (1).webp">

  <style>
    :root {
      --color-bg-card: rgba(65, 69, 89, 0.67);
      --color-box: #414559;
      --color-accent: #f2d5cf;
      --color-text: #c6d0f5;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: url("2026_06_19_0lw_Kleki (1).webp") center / cover no-repeat;
      overflow: hidden;
    }

    .no-select {
      -webkit-user-drag: none;
      user-select: none;
    }

    .foreground {
      position: absolute;
      left: 50%;
      top: 33.33%;
      transform: translate(-50%, -50%);
      width: 15%;
      height: auto;
    }

    .search-box, .shortcuts-container, .weather-card {
      position: absolute;
      left: 50%;
      width: 500px;
      transform: translate(-50%, -50%);
    }

    .search-box, .shortcut-card, .weather-card {
      border: 3px solid var(--color-accent);
      border-radius: 15px;
    }

    .shortcut-card, .weather-card {
      background-color: var(--color-bg-card);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .search-box {
      top: 50%;
      height: 50px;
      display: flex;
      align-items: center;
      background-color: var(--color-box);
      overflow: hidden;
    }

    .search-icon {
      width: 28px;
      height: 28px;
      object-fit: contain;
      margin: 0 14px;
      flex-shrink: 0;
    }

    .divider {
      width: 2px;
      height: 28px;
      background-color: var(--color-accent);
      flex-shrink: 0;
    }

    .input-box {
      flex: 1;
      height: 100%;
      padding: 0 14px;
      background: transparent;
      color: var(--color-text);
      border: none;
      outline: none;
      font-size: 16px;
    }

    .input-box::placeholder {
      color: var(--color-text);
      opacity: 0.7;
    }

    .shortcuts-container {
      top: 64%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .shortcut-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: var(--color-text);
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .shortcut-item:hover {
      transform: scale(1.08);
    }

    .shortcut-card {
      width: 67px;
      height: 67px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .shortcut-icon {
      width: 37px;
      height: 37px;
      object-fit: contain;
    }

    .shortcut-name {
      font-size: 14px;
      color: var(--color-text);
      white-space: nowrap;
    }

    .weather-card {
      top: 80%;
      height: 150px;
      color: var(--color-text);
      overflow: hidden;
    }

    .weather-location {
      position: absolute;
      top: 12px;
      left: 18px;
      font-size: 16px;
      line-height: 20px;
      color: var(--color-text);
    }

    .weather-data {
      position: absolute;
      left: 50%;
      top: 55%;
      transform: translate(-50%, -50%);
      width: 82%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .weather-item {
      width: 42%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .weather-icon {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .weather-value {
      font-size: 15px;
      line-height: 20px;
      color: var(--color-text);
      white-space: nowrap;
    }

    .compass, .pressure-icon {
      position: relative;
      width: 54px;
      height: 54px;
      border: 3px solid var(--color-accent);
      border-radius: 50%;
    }

    .compass span {
      position: absolute;
      font-size: 9px;
      font-weight: 500;
      color: var(--color-accent);
    }

    .compass-n { top: 2px; left: 50%; transform: translateX(-50%); }
    .compass-e { right: 3px; top: 50%; transform: translateY(-50%); }
    .compass-s { bottom: 2px; left: 50%; transform: translateX(-50%); }
    .compass-w { left: 3px; top: 50%; transform: translateY(-50%); }

    .compass-pointer, .pressure-pointer {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 2px;
      transform-origin: 50% 100%;
      transform: translate(-50%, -100%) rotate(0deg);
      background-color: var(--color-accent);
      border-radius: 2px;
    }

    .compass-pointer {
      height: 20px;
    }

    .compass-pointer::before {
      content: "";
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-bottom: 7px solid var(--color-accent);
    }

    .compass-center, .pressure-center {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 5px;
      height: 5px;
      transform: translate(-50%, -50%);
      background-color: var(--color-accent);
      border-radius: 50%;
    }

    .pressure-icon::before {
      content: "";
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      height: 24px;
      border-top: 3px solid var(--color-accent);
      border-radius: 50%;
    }

    .pressure-pointer {
      height: 18px;
    }

    .pressure-pointer::before {
      content: "";
      position: absolute;
      top: -4px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 3.5px solid transparent;
      border-right: 3.5px solid transparent;
      border-bottom: 6px solid var(--color-accent);
    }

    @media (max-width: 768px) {
      body {
        overflow: auto;
        background-position: center top;
        -webkit-overflow-scrolling: touch;
      }

      .foreground {
        top: 10%;
        left: 50%;
        transform: translateX(-50%);
        width: 42%;
        max-width: 220px;
        height: auto;
      }

      .search-box, .shortcuts-container, .weather-card {
        width: calc(100% - 32px);
        max-width: 540px;
      }

      .search-box {
        top: 38%;
        height: 54px;
        padding-right: 12px;
      }

      .search-icon {
        width: 24px;
        height: 24px;
        margin-left: 12px;
        margin-right: 8px;
      }

      .divider {
        height: 22px;
        margin-right: 8px;
      }

      .input-box {
        padding: 0 10px;
      }

      .input-box::placeholder {
        opacity: 0.85;
      }

      img[oncontextmenu] {
        -webkit-user-drag: none;
        user-select: none;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
      }

      .shortcuts-container {
        top: 57%;
      }

      .shortcut-card {
        width: 54px;
        height: 54px;
      }

      .shortcut-icon {
        width: 30px;
        height: 30px;
      }

      .shortcut-name {
        font-size: 13px;
      }

      .weather-card {
        top: 78%;
      }

      .weather-location {
        top: 10px;
        left: 16px;
        font-size: 15px;
      }

      .weather-data {
        width: 90%;
        top: 56%;
      }

      .weather-icon {
        width: 52px;
        height: 52px;
        margin-bottom: 5px;
      }

      .compass, .pressure-icon {
        width: 48px;
        height: 48px;
      }

      .weather-value {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <img class="foreground no-select" src="brave_color_darkbackground.webp" alt="" oncontextmenu="return false;">

  <div class="search-box">
    <img class="search-icon no-select" src="startpage-logomark.webp" alt="" oncontextmenu="return false;">
    <div class="divider"></div>
    <input type="text" class="input-box" placeholder="Search Startpage" id="search" autofocus>
  </div>

  <div class="shortcuts-container no-select">
    <a href="https://www.youtube.com" class="shortcut-item">
      <div class="shortcut-card">
        <img class="shortcut-icon no-select" src="YT.webp" alt="YT" oncontextmenu="return false;">
      </div>
      <span class="shortcut-name">YT</span>
    </a>

    <a href="https://www.instagram.com" class="shortcut-item">
      <div class="shortcut-card">
        <img class="shortcut-icon no-select" src="IG.webp" alt="IG" oncontextmenu="return false;">
      </div>
      <span class="shortcut-name">IG</span>
    </a>

    <a href="https://www.threads.com" class="shortcut-item">
      <div class="shortcut-card">
        <img class="shortcut-icon no-select" src="THREADS.webp" alt="脆" oncontextmenu="return false;">
      </div>
      <span class="shortcut-name">脆</span>
    </a>

    <a href="https://x.com/home" class="shortcut-item">
      <div class="shortcut-card">
        <img class="shortcut-icon no-select" src="X.webp" alt="X" oncontextmenu="return false;">
      </div>
      <span class="shortcut-name">X</span>
    </a>

    <a href="https://discord.com/channels/@me" class="shortcut-item">
      <div class="shortcut-card">
        <img class="shortcut-icon no-select" src="DC.webp" alt="DC" oncontextmenu="return false;">
      </div>
      <span class="shortcut-name">DC</span>
    </a>
  </div>

  <div class="weather-card no-select">
    <div class="weather-location" id="weather-location">Loading…</div>

    <div class="weather-data">
      <div class="weather-item">
        <div class="weather-icon">
          <div class="compass">
            <span class="compass-n">N</span>
            <span class="compass-e">E</span>
            <span class="compass-s">S</span>
            <span class="compass-w">W</span>
            <div class="compass-pointer" id="compass-pointer"></div>
            <div class="compass-center"></div>
          </div>
        </div>
        <div class="weather-value" id="wind-value">Loading…</div>
      </div>

      <div class="weather-item">
        <div class="weather-icon">
          <div class="pressure-icon">
            <div class="pressure-pointer"></div>
            <div class="pressure-center"></div>
          </div>
        </div>
        <div class="weather-value" id="pressure-value">Loading…</div>
      </div>
    </div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const DIRS = ["N", "NNE", "NE", "ENE", "E", "ESE", "SE", "SSE", "S", "SSW", "SW", "WSW", "W", "WNW", "NW", "NNW"];

    $("search").addEventListener("keydown", e => {
      const q = e.target.value.trim();
      if (e.key === "Enter" && q) {
        location.href = `https://www.startpage.com/do/search?q=${encodeURIComponent(q)}&segment=startpage.brave`;
      }
    });

    (async () => {
      const locEl = $("weather-location"), windEl = $("wind-value"), presEl = $("pressure-value");
      try {
        const res = await fetch("weather.json");
        if (!res.ok) throw 0;
        const { location: loc, wind_direction_10m, surface_pressure } = await res.json();
        locEl.textContent = loc;
        const dir = +wind_direction_10m;
        windEl.textContent = `${dir}° · ${DIRS[Math.round(dir / 22.5) % 16]}`;
        $("compass-pointer").style.transform = `translate(-50%, -100%) rotate(${dir}deg)`;
        const p = +surface_pressure;
        document.querySelector(".pressure-pointer").style.transform = `translate(-50%, -100%) rotate(${-90 + ((p - 950) / 100) * 180}deg)`;
        presEl.textContent = `${p.toFixed(1)} hPa`;
      } catch {
        locEl.textContent = "Failed to load weather data";
        windEl.textContent = presEl.textContent = "—";
      }
    })();
  </script>

</body>
</html>
